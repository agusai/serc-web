<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SERC Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div id="appHeader"></div>

    <main class="app-shell">
      <section class="app-shell" style="width:min(1180px,calc(100% - 32px));margin:0 auto;">
        <div class="page-header">
          <div>
            <span class="eyebrow">Coach portal</span>
            <h1 style="font-family:'Anton',sans-serif;letter-spacing:0.04em;margin:0.45rem 0 0;">Home dashboard</h1>
          </div>
          <a class="button button-primary" href="squad.html">View squad</a>
        </div>

        <div class="kpi-grid">
          <article class="kpi-card players">
            <div class="label">Players</div>
            <strong>—</strong>
          </article>
          <article class="kpi-card next-session">
            <div class="label">Next session</div>
            <strong>—</strong>
          </article>
          <article class="kpi-card matches">
            <div class="label">Matches</div>
            <strong>—</strong>
          </article>
          <article class="kpi-card attendance">
            <div class="label">Attendance</div>
            <strong>—</strong>
          </article>
        </div>

        <div class="metric-grid" style="margin-top:1.5rem;">
          <article class="card">
            <h3>Top 5 players</h3>
            <div class="card-list">
              <!-- dynamically populated -->
            </div>
          </article>

          <article class="card">
            <h3>Next match</h3>
            <div class="list-item">
              <div class="row-between"><strong id="nextMatchTitle">—</strong><span class="pill">U14</span></div>
              <p class="muted" id="nextMatchMeta">—</p>
            </div>
          </article>
        </div>
      </section>
    </main>

    <script src="../shared/lib/config.js"></script>
    <script src="../shared/lib/utils.js"></script>
    <script src="../shared/ui/header.js"></script>
    <script src="../shared/ui/toast.js"></script>
    <script src="../shared/guards/protect.js"></script>
    <script>
      window.SERC_GUARDS.protect('coach');
      window.SERCUI.renderHeader('Coach dashboard');
    </script>

    <script src="../shared/lib/supabase_client.js"></script>
    <script src="../shared/api/adapter.js"></script>
    <script src="coach-data.js"></script>
  </body>
</html>
