<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SERC Squad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/squad.css" />
  </head>
  <body>
    <div id="appHeader"></div>

    <main class="app-shell">
      <section class="page-shell">
        <div class="page-header">
          <div>
            <span class="eyebrow">Squad</span>
            <h1>Player management</h1>
          </div>
          <button class="button button-primary" type="button">+ Add player</button>
        </div>

        <article class="table-card card">
          <table>
            <thead>
              <tr>
                <th>Player</th>
                <th>Category</th>
                <th>Position</th>
                <th>Metrics</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="squadTableBody"></tbody>
          </table>
        </article>
      </section>
    </main>

    <script src="../shared/lib/config.js"></script>
    <script src="../shared/lib/utils.js"></script>
    <script src="../shared/ui/header.js"></script>
    <script src="../shared/ui/sheet.js"></script>
    <script src="../shared/guards/protect.js"></script>
    <script>
      window.SERC_GUARDS.protect('coaching');
      window.SERCUI.renderHeader('Coach dashboard');
    </script>

    <script src="../shared/lib/supabase_client.js"></script>
    <script src="../shared/api/adapter.js"></script>
    <script src="./js/squad.js"></script>
  </body>
</html>
