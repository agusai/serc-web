<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SERC Matches</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div id="appHeader"></div>

    <main class="app-shell">
      <section style="width:min(1180px,calc(100% - 32px));margin:0 auto;">
        <div class="page-header">
          <div>
            <span class="eyebrow">Match center</span>
            <h1 style="font-family:'Anton',sans-serif;letter-spacing:0.04em;margin:0.45rem 0 0;">Fixtures and analysis</h1>
          </div>
          <button class="button button-primary" type="button">+ Add fixture</button>
        </div>

        <article class="table-card card">
          <table>
            <thead>
              <tr>
                <th>Opponent</th>
                <th>Date</th>
                <th>Venue</th>
                <th>Outcome</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>KL Falcons</td>
                <td>12 Oct 2026</td>
                <td>Serdang Field</td>
                <td>Pending</td>
              </tr>
              <tr>
                <td>PJ Rugby</td>
                <td>18 Oct 2026</td>
                <td>PJ Sports Complex</td>
                <td>Pending</td>
              </tr>
            </tbody>
          </table>
        </article>
      </section>
    </main>

    <script src="../app/shared/lib/config.js"></script>
    <script src="../app/shared/lib/utils.js"></script>
    <script src="../app/shared/ui/header.js"></script>
    <script src="../app/shared/guards/protect.js"></script>
    <script>
      window.SERC_GUARDS.protect('coach');
      window.SERCUI.renderHeader('Coach dashboard');
    </script>
  </body>
</html>
