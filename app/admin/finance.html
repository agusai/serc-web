<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D0D0D">
  <title>SERC Admin · Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../coach/css/coach.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <header class="app-header">
    <img src="../../images/serc-logo.png" alt="SERC" class="app-logo" onerror="this.style.display='none'">
    <div class="app-title">
      <div class="app-title-main">SERC Admin</div>
      <div class="app-title-sub" id="header-sub">Management</div>
    </div>
    <button class="icon-btn" id="logout-btn" title="Logout">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </header>

  <main class="app-main">
    <div class="dash-section">
      <div class="dash-tag">Kewangan</div>
      <h1 class="dash-title">Kutipan Fees</h1>
      <p style="color:var(--gray);font-size:0.85rem;margin-top:-12px;margin-bottom:16px" id="period-label">—</p>
    </div>

    <div class="summary-grid" id="summary-grid">
      <div class="summary-card"><div class="label">Total</div><div class="value">—</div></div>
      <div class="summary-card"><div class="label">Dah Bayar</div><div class="value good">—</div></div>
      <div class="summary-card"><div class="label">Belum Bayar</div><div class="value bad">—</div></div>
      <div class="summary-card"><div class="label">Waived</div><div class="value orange">—</div></div>
    </div>

    <div class="filter-row" id="filter-tabs">
      <button class="filter-chip active" data-filter="all">Semua</button>
      <button class="filter-chip" data-filter="unpaid">Belum Bayar</button>
      <button class="filter-chip" data-filter="paid">Dah Bayar</button>
      <button class="filter-chip" data-filter="waived">Waived</button>
    </div>

    <div class="fee-list" id="fee-list">
      <div class="loading-state" style="padding:40px 20px"><div class="spinner"></div></div>
    </div>
  </main>

  <nav class="dock" id="app-dock">
    <a href="index.html" class="dock-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="dock-item-label">Home</span>
    </a>
    <a href="#" class="dock-item" data-soon="1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <span class="dock-item-label">Players</span>
    </a>
    <a href="finance.html" class="dock-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span class="dock-item-label">Finance</span>
    </a>
    <a href="#" class="dock-item" data-soon="1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="dock-item-label">Events</span>
    </a>
    <a href="#" class="dock-item" data-soon="1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span class="dock-item-label">More</span>
    </a>
  </nav>

  <script src="../shared/lib/config.js"></script>
  <script src="../shared/lib/supabase_client.js"></script>
  <script src="../shared/lib/supabase.js"></script>
  <script src="../shared/api/fees.js"></script>
  <script src="js/finance.js"></script>
</body>
</html>
