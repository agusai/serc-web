<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D0D0D">
  <title>SERC Admin · Finance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="css/admin.css">

  <script src="../shared/lib/config.js"></script>
  <script src="../shared/lib/supabase_client.js"></script>
  <script src="../shared/lib/supabase.js"></script>
  <script src="../shared/api/fees.js"></script>
</head>
<body>

  <header class="app-header" id="app-header">
    <div class="header-brand">
      <div class="header-logo">SERC</div>
      <div class="header-brand-text">
        <span class="header-brand-name">SERC ADMIN</span>
        <span class="header-brand-sub">Management</span>
      </div>
    </div>
    <div class="header-user" id="header-user">
      <div class="sk sk-line" style="width:80px;height:12px"></div>
      <div class="sk sk-line" style="width:50px;height:8px;margin-top:4px"></div>
    </div>
  </header>

  <main class="app-main">
    <div class="page-head">
      <h1>KUTIPAN FEES</h1>
      <p id="period-label">—</p>
    </div>

    <!-- SUMMARY -->
    <section class="summary-grid" id="summary-grid">
      <div class="sk-card"><div class="sk sk-line sk-line-sm"></div><div class="sk sk-line sk-line-lg"></div></div>
      <div class="sk-card"><div class="sk sk-line sk-line-sm"></div><div class="sk sk-line sk-line-lg"></div></div>
      <div class="sk-card"><div class="sk sk-line sk-line-sm"></div><div class="sk sk-line sk-line-lg"></div></div>
      <div class="sk-card"><div class="sk sk-line sk-line-sm"></div><div class="sk sk-line sk-line-lg"></div></div>
    </section>

    <div class="section-head"><h2>Senarai Fees</h2></div>

    <div class="filter-tabs" id="filter-tabs">
      <button class="tab active" data-filter="all">Semua</button>
      <button class="tab" data-filter="unpaid">Belum Bayar</button>
      <button class="tab" data-filter="paid">Dah Bayar</button>
      <button class="tab" data-filter="waived">Waived</button>
    </div>

    <section class="fee-list" id="fee-list">
      <div class="sk-list-item"><div class="sk-avatar"></div><div class="sk-list-body"><div class="sk sk-line sk-line-md"></div><div class="sk sk-line sk-line-sm"></div></div><div class="sk sk-line" style="width:64px"></div></div>
      <div class="sk-list-item"><div class="sk-avatar"></div><div class="sk-list-body"><div class="sk sk-line sk-line-md"></div><div class="sk sk-line sk-line-sm"></div></div><div class="sk sk-line" style="width:64px"></div></div>
      <div class="sk-list-item"><div class="sk-avatar"></div><div class="sk-list-body"><div class="sk sk-line sk-line-md"></div><div class="sk sk-line sk-line-sm"></div></div><div class="sk sk-line" style="width:64px"></div></div>
    </section>
  </main>

  <!-- FLOATING DOCK -->
  <nav class="app-dock" id="app-dock">
    <a href="index.html" class="dock-item">
      <span class="dock-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>

    <a href="#" class="dock-item" data-soon="1">

      </span>
      <span class="dock-label">Players</span>
    </a>
    <a href="finance.html" class="dock-item active">
      <span class="dock-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </span>
      <span class="dock-label">Finance</span>

    <a href="#" class="dock-item" data-soon="1">
      <span class="dock-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </span>
      <span class="dock-label">Events</span>
    </a>
    <a href="#" class="dock-item" data-soon="1">
      <span class="dock-icon">

  <script src="js/finance.js"></script>
