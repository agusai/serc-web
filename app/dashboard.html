<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>Dashboard · Serdang Eagles</title>
<link rel="icon" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- TOP BAR -->
<header class="app-header">
  <img src="../images/logo.png" alt="SERC" class="app-logo">
  <div class="app-title">
    <div class="app-title-main" id="userGreeting">Welcome</div>
    <div class="app-title-sub" id="userRole">Loading...</div>
  </div>
  <button class="icon-btn" id="logoutBtn" aria-label="Logout">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
    </svg>
  </button>
</header>

<!-- MAIN CONTENT -->
<main class="app-main" id="appMain">
  <div class="loading-state">
    <div class="spinner"></div>
    <div>Loading...</div>
  </div>
</main>

<!-- FLOATING DOCK -->
<nav class="dock" id="dock">
  <!-- Injected by JS -->
</nav>

<script type="module" src="../js/firebase.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
